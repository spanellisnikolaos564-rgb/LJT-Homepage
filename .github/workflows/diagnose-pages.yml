name: Diagnose Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Pages API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://api.github.com/repos/" + os.environ["REPO"] + "/pages"
          headers = {
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, response.read().decode()
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode()
              except Exception as error:
                  return 0, repr(error)

          lines = []
          status, body = request("GET")
          lines.append("GET " + str(status) + " " + body[:700])
          if status == 404:
              status, body = request("POST", {"build_type": "workflow"})
              lines.append("POST " + str(status) + " " + body[:700])
          with open("/tmp/pages-diagnostic.txt", "w") as output:
              output.write("\n".join(lines))
          PY
      - name: Record diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="Pages setup diagnostic [skip ci]

$(cat /tmp/pages-diagnostic.txt)"
          git commit --allow-empty -m "$msg"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:master
